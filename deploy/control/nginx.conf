worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting for Auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # Image caching configuration
    proxy_cache_path /var/cache/nginx/images
        levels=1:2
        keys_zone=image_cache_zone:50m
        max_size=10g
        inactive=30d
        use_temp_path=off;

    server {
        listen 80;
        server_name tv.example.com api.example.com images.example.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Global CORS configuration for Smart TV Web Engines (MSX / Tizen / webOS)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Device-Id, X-App-Version' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Media Station X Launcher Entrypoint
        location /msx/start.json {
            alias /var/www/msx/start.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # Image Caching Proxy for TMDB Posters / Backdrops
        location /t/p/ {
            proxy_pass https://image.tmdb.org/t/p/;
            proxy_cache image_cache_zone;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Auth endpoints with rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core Backend API Gateway
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Frontend Web App
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
